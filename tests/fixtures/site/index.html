<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>DesignDebt Fixture</title>
    <style>
      body { margin: 0; font-family: Inter, Arial, sans-serif; color: #111827; }
      main { padding: 24px; }
      .primary { background: #0066cc; color: white; padding: 12px 18px; border-radius: 8px; border: 1px solid #0066cc; }
      .primary-alt { background: #0569c9; color: #fff; padding: 11px 16px; border-radius: 7px; border: 1px solid #0569c9; }
      .primary-third { background: rgb(0, 101, 200); color: white; padding: 10px 17px; border-radius: 10px; border: 1px solid #0065c8; }
      .card { margin-top: 18px; padding: 18px 24px; border: 1px solid #e5e7eb; border-radius: 12px; box-shadow: 0 12px 32px rgba(15,23,42,.08); }
      input { padding: 12px; border: 1px solid #d4d4d8; border-radius: 8px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Fixture product</h1>
      <button class="primary">Primary</button>
      <a class="primary-alt" href="/account">Account</a>
      <button class="primary-third">Save</button>
      <section class="card">
        <p style="margin: 18px 0; font-size: 15px;">This fixture intentionally contains inconsistent colors, spacing, button styles, borders, and form controls.</p>
        <input id="email" placeholder="Email">
      </section>
    </main>
  </body>
</html>
